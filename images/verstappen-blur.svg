<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle cx="200" cy="120" r="60" fill="#f8fafc"/>
    <rect x="140" y="180" width="120" height="100" rx="10" fill="#f8fafc"/>
    <text x="200" y="280" text-anchor="middle" fill="white" font-size="24" font-family="Arial">?</text>
  </g>
  <text x="200" y="290" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-size="12" font-family="Arial">Max Verstappen - Placeholder</text>
</svg>
